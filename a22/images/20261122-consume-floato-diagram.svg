<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
 <title id="title">浮屏把截图做成锁屏卡片，便利以云端识别为前提</title><desc id="desc">浮屏处理路径：用户选择订单或票据截图，上传经第三方云端识别后生成锁屏卡片，使用前需核对原订单；不是离线流程。</desc>
